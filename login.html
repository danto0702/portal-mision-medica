<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceso — Portal Salud Pública HRNO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0d1117;
  --card:     #161b22;
  --border:   #30363d;
  --text:     #e6edf3;
  --muted:    #8b949e;
  --primary:  #e94560;
  --primary-h:#c73550;
  --green:    #38c793;
  --yellow:   #ffb432;
  --input-bg: #0d1117;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}

/* ── Branding ── */
.brand {
  text-align: center;
  margin-bottom: 32px;
}
.brand-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: linear-gradient(135deg, #7c1d6f 0%, #e94560 100%);
  font-size: 1.5rem;
  margin-bottom: 14px;
  box-shadow: 0 4px 20px rgba(233, 69, 96, .3);
}
.brand-name {
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.brand-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text);
}

/* ── Card ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 32px 28px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
}

.card-heading {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 6px;
}
.card-sub {
  font-size: .82rem;
  color: var(--muted);
  margin-bottom: 28px;
}

/* ── Form ── */
.field { margin-bottom: 18px; }
label {
  display: block;
  font-size: .78rem;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 7px;
  letter-spacing: .04em;
  text-transform: uppercase;
}
input[type="email"],
input[type="password"] {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 14px;
  font-size: .9rem;
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
input[type="email"]:focus,
input[type="password"]:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(233,69,96,.15);
}
input::placeholder { color: var(--border); }

/* ── Error / alert ── */
.alert {
  display: none;
  background: rgba(233, 69, 96, .1);
  border: 1px solid rgba(233,69,96,.35);
  border-radius: 8px;
  padding: 11px 14px;
  font-size: .83rem;
  color: var(--primary);
  margin-bottom: 18px;
  line-height: 1.45;
}
.alert.show { display: flex; align-items: flex-start; gap: 8px; }
.alert-icon { flex-shrink: 0; margin-top: 1px; }

/* ── Button ── */
.btn-login {
  width: 100%;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, opacity .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-login:hover:not(:disabled) { background: var(--primary-h); }
.btn-login:disabled { opacity: .55; cursor: not-allowed; }

/* ── Spinner ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spin {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: none;
}
.btn-login.loading .spin { display: block; }
.btn-login.loading .btn-txt { display: none; }

/* ── Botón invitado ── */
.btn-guest {
  display: block;
  width: 100%;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  font-size: .85rem;
  font-weight: 600;
  color: var(--muted);
  text-decoration: none;
  text-align: center;
  transition: all .15s;
}
.btn-guest:hover {
  border-color: var(--muted);
  color: var(--text);
  background: rgba(255,255,255,.04);
}

/* ── Footer ── */
.login-footer {
  margin-top: 32px;
  text-align: center;
  font-size: .75rem;
  color: var(--muted);
  line-height: 1.7;
}

/* ── Success overlay ── */
.success-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.success-overlay.show { display: flex; }
.success-icon { font-size: 3rem; }
.success-msg  { font-size: 1rem; font-weight: 600; color: var(--green); }
.success-sub  { font-size: .82rem; color: var(--muted); }
</style>
</head>
<body>

<!-- Success overlay -->
<div class="success-overlay" id="successOverlay">
  <div class="success-icon">✓</div>
  <p class="success-msg">Acceso verificado</p>
  <p class="success-sub" id="successNombre">Cargando...</p>
</div>

<!-- Brand -->
<div class="brand">
  <div class="brand-badge">🏥</div>
  <p class="brand-name">ESE Hospital Regional Noroccidental</p>
  <p class="brand-title">Portal Salud Pública</p>
</div>

<!-- Card -->
<div class="card">
  <p class="card-heading">Iniciar sesión</p>
  <p class="card-sub">Accede con tus credenciales institucionales</p>

  <div class="alert" id="alert" role="alert">
    <span class="alert-icon">⚠</span>
    <span id="alertMsg">Error</span>
  </div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" placeholder="usuario@ejemplo.com" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="btnLogin">
      <div class="spin"></div>
      <span class="btn-txt">Ingresar al portal</span>
    </button>
  </form>

  <div style="margin-top:18px;text-align:center;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <div style="flex:1;height:1px;background:var(--border);"></div>
      <span style="font-size:.72rem;color:var(--muted);white-space:nowrap;">o continúa sin cuenta</span>
      <div style="flex:1;height:1px;background:var(--border);"></div>
    </div>
    <a href="index.html?invitado=1" class="btn-guest">
      Ver módulos públicos
    </a>
  </div>
</div>

<div class="login-footer">
  Portal de uso interno exclusivo<br>
  Coordinación de Salud Pública · Norte de Santander
</div>

<script>
(async function () {
  // ── Si ya hay sesión activa, redirigir directamente ──────────────
  const existente = await portalVerificarSesion({ publico: true });
  if (existente) {
    window.location.href = 'index.html';
    return;
  }

  // ── Mostrar error de URL si viene de un redirect ─────────────────
  const params = new URLSearchParams(window.location.search);
  const err    = params.get('error');
  if (err) {
    const MSGS = {
      inactivo:              'Tu cuenta ha sido desactivada. Contacta al administrador.',
      usuario_no_encontrado: 'Tu usuario no está registrado en el portal. Contacta al administrador.',
      error:                 'Ocurrió un error al cargar tu perfil. Intenta nuevamente.'
    };
    mostrarError(MSGS[err] || 'Error de acceso. Intenta nuevamente.');
  }

  // ── Formulario ───────────────────────────────────────────────────
  const form    = document.getElementById('loginForm');
  const btnLogin = document.getElementById('btnLogin');
  const emailEl  = document.getElementById('email');
  const passEl   = document.getElementById('password');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    ocultarError();
    setLoading(true);

    const email    = emailEl.value.trim();
    const password = passEl.value;

    if (!email || !password) {
      mostrarError('Completa el correo y la contraseña.');
      setLoading(false);
      return;
    }

    try {
      // 1. Login en Supabase
      const { data, error } = await portalSb.auth.signInWithPassword({ email, password });

      if (error) {
        if (error.message.includes('Invalid login credentials') || error.message.includes('invalid_credentials')) {
          mostrarError('Correo o contraseña incorrectos. Verifica tus datos.');
        } else if (error.message.includes('Email not confirmed')) {
          mostrarError('Correo no confirmado. Contacta al administrador.');
        } else {
          mostrarError('Error al iniciar sesión: ' + error.message);
        }
        setLoading(false);
        return;
      }

      // 2. Cargar permisos (portalVerificarSesion con publico:true no redirige)
      const sesion = await portalVerificarSesion({ publico: false });
      if (!sesion) { setLoading(false); return; } // redirigirá si hay error

      // 3. Registrar acceso en log
      await portalLog(null, 'login', { desde: 'login.html' });

      // 4. Mostrar overlay de éxito y redirigir
      document.getElementById('successNombre').textContent = 'Bienvenido, ' + (sesion.user.nombre || email);
      document.getElementById('successOverlay').classList.add('show');

      setTimeout(function () {
        window.location.href = 'index.html';
      }, 1200);

    } catch (ex) {
      mostrarError('Error inesperado: ' + ex.message);
      setLoading(false);
    }
  });

  // ── Helpers UI ───────────────────────────────────────────────────
  function mostrarError(msg) {
    document.getElementById('alertMsg').textContent = msg;
    document.getElementById('alert').classList.add('show');
  }
  function ocultarError() {
    document.getElementById('alert').classList.remove('show');
  }
  function setLoading(on) {
    btnLogin.disabled = on;
    btnLogin.classList.toggle('loading', on);
  }

  // Enter en campo de contraseña envía el form
  passEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
  });
})();
</script>
</body>
</html>
